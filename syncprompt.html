function stopTakeRecording() {
  if (takeRecorder && takeRecorder.state !== 'inactive') takeRecorder.stop();
  takeRecorder = null;
}

function exportTakeAudio() {
  if (takeAudio) downloadBlob(`take-${fileStamp()}.${takeAudio.ext}`, takeAudio.blob);
}

function showExportMenu(btn) {
  // Remove existing menu if any
  const existing = document.querySelector('.export-menu');
  if (existing) { existing.remove(); return; }
  const menu = document.createElement('div');
  menu.className = 'export-menu';
  const item = (call, label) => `<button onclick="event.stopPropagation(); ${call}; this.parentElement.remove()">${label}</button>`;
  menu.innerHTML = (captionTimeline.length
      ? item("exportCaptions('srt')", 'SRT (Recommended)') + item("exportCaptions('vtt')", 'VTT (Web)')
        + item("exportCaptions('txt')", 'TXT (Plain text)') + item('exportYouTubeChapters()', 'YouTube chapters (.txt)')
      : '')
    + (takeAudio ? item('exportTakeAudio()', `Take audio (.${takeAudio.ext})`) : '');
  btn.style.position = 'relative';
  btn.appendChild(menu);
  // Close on outside click
  setTimeout(() => {
    const closer = (e) => { if (!menu.contains(e.target) && e.target !== btn) { menu.remove(); document.removeEventListener('click', closer); } };
    document.addEventListener('click', closer);
  }, 10);
}

// ---- Teleprompter window ----
function openTeleprompterWindow() {
  if (isTeleprompterOpen()) {
    teleprompterWindow.focus();
    return;
  }
  const url = location.href.split('?')[0] + '?teleprompter=1';
  teleprompterWindow = window.open(url, 'teleprompter', 'width=1024,height=600');
  // The prompter sends 'tpReady' once loaded (also after a reload) → sendFullStateToPrompter()
}

// Everything the prompter needs to show the current state — on first open, reopen or reload
function sendFullStateToPrompter() {
  updateButtonStates();
  broadcastMessage({ type: 'script', scriptText, settings }); // resets the prompter to the top...
  broadcastTpState();
  // ...so the position goes after it
  if (isVoiceActive && (isStarted || currentWordIndex > 0)) {
    broadcastMessage({ type: 'highlightWord', wordIndex: currentWordIndex, lineIndex: currentLineIndex });
  } else if (currentLineIndex > 0) {
    broadcastMessage({ type: 'scrollToLine', lineIndex: currentLineIndex, smooth: false });
  }
  if (isScrolling) broadcastMessage({ type: 'startManualScroll', speed: manualScrollSpeed });
  if (isPaused) broadcastMessage({ type: 'countdown', text: 'PAUSED' });
}

// ---- Start / Pause / Resume / End (session lifecycle) ----
function toggleStart() {
  if (!isTeleprompterOpen()) return;
  if (isCountingDown) return; // Ignore a second press (or key repeat) during the 3-2-1 — Escape cancels

  if (!isStarted) {
    // Start new session
    if (teleprompterWindow && !teleprompterWindow.closed) {
      teleprompterWindow.focus();
    }
    if (settings.countdownEnabled) {
      startCountdown(() => startSession());
    } else {
      startSession();
    }
  } else if (!isPaused) {
    // Pause running session
    pauseSession();
  } else {
    // Resume paused session
    resumeSession();
  }
}

function endSession() {
  if (!isStarted) return;
  captionSessionEndMs = Date.now() - sessionStats.startTime;
  if (isVoiceActive) logSessionSummary();
  addStateLine('End session');
  isStarted = false;
  isPaused = false;
  isScrolling = false;
  const btn = document.getElementById('start-btn');
  btn.textContent = 'Start';
  btn.classList.remove('active');
  const endBtn = document.getElementById('end-btn');
  if (endBtn) endBtn.disabled = true;

  const scrollBtn = document.getElementById('scroll-btn');
  scrollBtn.textContent = 'Auto Scroll';
  scrollBtn.classList.remove('active');

  pauseTimer();
  stopSpeechRecognition();
  stopTakeRecording(); // before the mic stops, so the file isn't cut short
  stopMicrophone();
  setEditorLocked(false);
  saveTakeState();

  broadcastMessage({ type: 'stopScroll' });

  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (dot) dot.classList.remove('listening');
  if (text) text.textContent = 'Session ended';
  broadcastMessage({ type: 'countdown', text: null }); // Clear PAUSED overlay
  broadcastTpState();

  // Enable caption export if we have recorded data
  updateExportButton();
}

function pauseSession() {
  isPaused = true;
  addStateLine('Pause session');
  const btn = document.getElementById('start-btn');
  btn.textContent = 'Resume';

  // Stop recognition and scroll but keep timer running (real time for SRT sync)
  stopSpeechRecognition();
  if (isScrolling) {
    isScrolling = false;
    broadcastMessage({ type: 'stopScroll' });
  }

  const scrollBtn = document.getElementById('scroll-btn');
  if (scrollBtn) { scrollBtn.textContent = 'Auto Scroll'; scrollBtn.classList.remove('active'); }

  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (dot) dot.classList.remove('listening');
  if (text) text.textContent = 'Paused';
  broadcastMessage({ type: 'countdown', text: 'PAUSED' });
  broadcastTpState();
}

function resumeSession() {
  isPaused = false;
  lastRealMatchTime = Date.now(); // Restart the stuck clock, but a guessed position stays a guess
  addStateLine('Resume session');
  const btn = document.getElementById('start-btn');
  btn.textContent = 'Pause';
  btn.classList.add('active');
  lastMatchTime = Date.now();

  if (isVoiceActive) {
    const startLang = scriptLineLangs[currentLineIndex] || 'ko';
    initSpeechRecognition(getRecogLangCode(startLang));
  } else {
    // Resume manual scroll
    isScrolling = true;
    manualScrollSpeed = settings.scrollSpeed;
    broadcastMessage({ type: 'startManualScroll', speed: manualScrollSpeed });
    const scrollBtn = document.getElementById('scroll-btn');
    scrollBtn.textContent = 'Stop Scroll';
    scrollBtn.classList.add('active');
  }

  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (isVoiceActive) {
    if (dot) dot.classList.add('listening');
    if (text) text.textContent = 'Listening...';
  } else {
    if (text) text.textContent = 'Scrolling';
  }
  broadcastMessage({ type: 'countdown', text: null }); // Clear PAUSED overlay
  broadcastTpState();
}

function broadcastTpState() {
  broadcastMessage({ type: 'tpState', started: isStarted, voice: isVoiceActive, scrolling: isScrolling });
}

function startSession() {
  isStarted = true;
  isPaused = false;
  captionTimeline = [];
  captionSessionEndMs = 0;
  try { localStorage.removeItem(LAST_TAKE_KEY); } catch {}
  addStateLine(`Start session (voice=${isVoiceActive}, scroll=${isScrolling})`);
  resetSessionStats();
  markRealPosition();
  takeAudio = null;
  if (settings.recordAudio) startTakeRecording();
  lastPermissionErrorAt = 0;
  lastResultAt = 0;
  transcriptLog = [];
  setEditorLocked(true);
  const btn = document.getElementById('start-btn');
  btn.textContent = 'Pause';
  btn.classList.add('active');
  const endBtn = document.getElementById('end-btn');
  if (endBtn) endBtn.disabled = false;
  // Disable export button during session
  const exportBtn = document.getElementById('btn-export-captions');
  if (exportBtn) exportBtn.disabled = true;

  resumeTimer();
  lastMatchTime = Date.now();
  diagLastMatchLine = -1;
  diagInterimCount = 0;
  // Record initial line for SRT (so first spoken line is captured)
  recordLineTransition(currentLineIndex);

  // If voice mode is on, start recognition with appropriate language
  if (isVoiceActive) {
    initMicrophone(); // Level meter + voice activity (already open when the countdown asked for it)
    const startLang = scriptLineLangs[currentLineIndex] || 'ko';
    initSpeechRecognition(getRecogLangCode(startLang));
  } else {
    // Start manual scroll
    isScrolling = true;
    manualScrollSpeed = settings.scrollSpeed;
    broadcastMessage({ type: 'startManualScroll', speed: manualScrollSpeed });
    const scrollBtn = document.getElementById('scroll-btn');
    scrollBtn.textContent = 'Stop Scroll';
    scrollBtn.classList.add('active');
  }

  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (isVoiceActive) {
    if (dot) dot.classList.add('listening');
    if (text) text.textContent = 'Listening...';
  } else {
    if (text) text.textContent = 'Scrolling';
  }

  broadcastTpState();
}

function stopSession() {
  // Legacy wrapper — calls endSession for backward compatibility (endOfScript, etc.)
  endSession();
}

// ---- Voice mode toggle (mode switch, not start/stop) ----
function toggleVoiceMode() {
  isVoiceActive = !isVoiceActive;
  addStateLine(`Voice mode ${isVoiceActive ? 'ON' : 'OFF'} (isStarted=${isStarted})`);
  const btn = document.getElementById('voice-mode-btn');
  btn.textContent = isVoiceActive ? 'Voice: ON' : 'Voice: OFF';
  btn.classList.toggle('on', isVoiceActive);

  if (isVoiceActive) {
    initMicrophone();
    if (isStarted) {
      // Session already running — start voice recognition now and stop manual scroll
      isScrolling = false;
      broadcastMessage({ type: 'stopScroll' });
      const scrollBtn = document.getElementById('scroll-btn');
      if (scrollBtn) { scrollBtn.textContent = 'Auto Scroll'; scrollBtn.classList.remove('active'); }
      // Re-anchor on the line manual scrolling reached (the word position is from before)
      currentWordIndex = findWordIndexForLine(currentLineIndex);
      currentAlignPos = findSyllablePosForLine(currentLineIndex);
      lastConsumedSylCount = 0;
      lastMatchTime = Date.now();
      markRealPosition();
      broadcastMessage({ type: 'highlightWord', wordIndex: currentWordIndex, lineIndex: currentLineIndex });
      const startLang = scriptLineLangs[currentLineIndex] || 'ko';
      initSpeechRecognition(getRecogLangCode(startLang));
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (dot) dot.classList.add('listening');
      if (text) text.textContent = 'Listening...';
      addDiagLine('Voice mode enabled mid-session — recognition started', 'match');
    } else {
      addDiagLine('Voice mode enabled - press Start to begin', 'match');
    }
  } else {
    addDiagLine('Voice mode disabled', '');
    // If session is running, switch to manual scroll
    if (isStarted) {
      stopSpeechRecognition();
      if (!takeRecorder) stopMicrophone(); // The take audio recording still needs the mic
      isScrolling = true;
      manualScrollSpeed = settings.scrollSpeed;
      broadcastMessage({ type: 'startManualScroll', speed: manualScrollSpeed });
      const text = document.getElementById('status-text');
      const dot = document.getElementById('status-dot');
      if (text) text.textContent = 'Scrolling';
      if (dot) dot.classList.remove('listening');
    }
  }
  broadcastTpState();
}

// ---- Manual scroll toggle ----
function toggleManualScroll() {
  addStateLine(`Toggle scroll (isStarted=${isStarted}, isScrolling=${isScrolling})`);
  if (!isTeleprompterOpen()) return;
  if (isCountingDown) return; // Checked before voice gets turned off below

  if (!isStarted) {
    // Start session in manual scroll mode
    isVoiceActive = false;
    const vmBtn = document.getElementById('voice-mode-btn');
    vmBtn.textContent = 'Voice: OFF';
    vmBtn.classList.remove('on');

    if (settings.countdownEnabled) {
      startCountdown(() => {
        startSession();
      });
    } else {
      startSession();
    }
  } else {
    // Toggle scroll while running
    isScrolling = !isScrolling;
    const btn = document.getElementById('scroll-btn');
    if (isScrolling) {
      btn.textContent = 'Stop Scroll';
      btn.classList.add('active');
      manualScrollSpeed = settings.scrollSpeed;
      broadcastMessage({ type: 'startManualScroll', speed: manualScrollSpeed });
    } else {
      btn.textContent = 'Auto Scroll';
      btn.classList.remove('active');
      broadcastMessage({ type: 'stopScroll' });
    }
    broadcastTpState();
  }
}

// ---- Countdown ----
async function startCountdown(callback) {
  if (isCountingDown) return;
  isCountingDown = true;
  const myGen = ++countdownGen;

  // Get mic permission FIRST if voice mode or audio recording is on (before showing countdown)
  if (isVoiceActive || settings.recordAudio) {
    broadcastMessage({ type: 'countdown', text: 'Mic...' });
    let micOk = false;
    try {
      micOk = await initMicrophone();
    } catch (err) {
      // e.g. navigator.mediaDevices missing when not served from localhost/https
      addDiagLine('ERROR: Microphone unavailable - ' + err.message, 'nomatch');
    }
    if (myGen !== countdownGen) return; // Cancelled while waiting — cancelCountdown already cleaned up
    if (!micOk) {
      isCountingDown = false;
      broadcastMessage({ type: 'countdown', text: null });
      return;
    }
  }

  let count = 3;
  broadcastMessage({ type: 'countdown', text: String(count) });

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      broadcastMessage({ type: 'countdown', text: String(count) });
    } else if (count === 0) {
      broadcastMessage({ type: 'countdown', text: 'GO' });
    } else {
      clearInterval(timer);
      if (countdownTimer === timer) countdownTimer = null;
      isCountingDown = false;
      broadcastMessage({ type: 'countdown', text: null });
      callback();
    }
  }, 1000);
  countdownTimer = timer;
}

function cancelCountdown() {
  isCountingDown = false;
  countdownGen++;
  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
  broadcastMessage({ type: 'countdown', text: null });
}

// ---- Microphone level ----
let audioCtx, analyser, micStream;
let micInitPromise = null;

// ---- Voice activity (from the mic level) ----
// Tells speaking from silence: pauses never count as "stuck", and the watchdog can restart a
// recognizer that stopped transcribing while you're still talking. Falls back to the gaps between
// recognition results when the mic level isn't available (or the window is throttled in the background).
const VAD_TICK_MS = 100;
let vadTimer = null;
let vadNoiseFloor = 0.01;
let vadLastVoiceAt = 0;
let vadLastTickAt = 0;           // 0 = not running
let vadSpeaking = false;
let vadSilenceStart = 0;
let speechMsSinceTranscript = 0; // Talking time since the recognizer last produced new text
let vadBuf = null;

function getMicRms() {
  if (!analyser) return null;
  if (!vadBuf || vadBuf.length !== analyser.fftSize) vadBuf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(vadBuf);
  let sum = 0;
  for (let i = 0; i < vadBuf.length; i++) sum += vadBuf[i] * vadBuf[i];
  return Math.sqrt(sum / vadBuf.length);
}

function vadActive() {
  return vadLastTickAt > 0 && Date.now() - vadLastTickAt < 500;
}

function vadTick() {
  const now = Date.now();
  const rms = getMicRms();
  if (rms === null) { vadLastTickAt = 0; return; }
  const dt = vadLastTickAt ? Math.min(500, now - vadLastTickAt) : VAD_TICK_MS;
  vadLastTickAt = now;
  // Noise floor: drops fast to quiet levels, rises slowly (pauses between sentences pull it back down)
  vadNoiseFloor = rms < vadNoiseFloor ? vadNoiseFloor * 0.8 + rms * 0.2 : vadNoiseFloor * 1.002;
  if (rms > Math.max(vadNoiseFloor * 3, 0.008)) vadLastVoiceAt = now;
  const speaking = now - vadLastVoiceAt < 400; // Short gaps between words still count as speaking
  if (speaking !== vadSpeaking) {
    vadSpeaking = speaking;
    if (!speaking) vadSilenceStart = now;
    else if (isStarted && !isPaused && vadSilenceStart && now - vadSilenceStart > 1500) {
      addDiagLine(`Silence ${((now - vadSilenceStart) / 1000).toFixed(1)}s (not counted as stuck)`, '');
    }
  }
  if (!isStarted || isPaused) return;
  if (speaking) {
    speechMsSinceTranscript += dt;
  } else {
    // Silence is not being stuck
    lastMatchTime = Math.min(now, lastMatchTime + dt);
    lastRealMatchTime = Math.min(now, lastRealMatchTime + dt);
  }
}

function stopMicrophone() {
  if (vadTimer) { clearInterval(vadTimer); vadTimer = null; }
  vadLastTickAt = 0;
  if (micStream) {
    micStream.getTracks().forEach(track => track.stop());
    micStream = null;
  }
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
    analyser = null;
  }
  micInitPromise = null;
}

function initMicrophone() {
  if (micStream) return Promise.resolve(true);
  if (micInitPromise) return micInitPromise;
  micInitPromise = navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    micStream = stream;
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    updateMicLevel();
    if (!vadTimer) vadTimer = setInterval(vadTick, VAD_TICK_MS);
    micInitPromise = null; // Clear so fresh request is made if mic is stopped & restarted
    return true;
  }).catch(err => {
    micInitPromise = null;
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (dot) dot.classList.add('error');
    if (text) text.textContent = 'Mic denied - check browser permissions';
    addDiagLine('ERROR: Microphone access denied - ' + err.message, 'nomatch');
    return false;
  });
  return micInitPromise;
}

function updateMicLevel() {
  if (!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  const level = Math.min(100, avg * 1.5);
  const fill = document.getElementById('mic-level');
  if (fill) fill.style.width = level + '%';
  requestAnimationFrame(updateMicLevel);
}

// ---- Speech Recognition ----
function initSpeechRecognition(lang) {
  lang = lang || currentRecogLang || 'ko-KR';
  currentRecogLang = lang;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    addDiagLine('ERROR: Web Speech API not supported in this browser', 'nomatch');
    addDiagLine('Try using Chrome or Edge', 'nomatch');
    return;
  }

  // Replacing a running recognizer (language switch, watchdog): its late events are ignored
  // below because it is no longer the current `recognition`
  if (recognition) {
    try { recognition.stop(); } catch {}
  }

  const rec = new SpeechRecognition();
  recognition = rec;
  rec.lang = lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onresult = (event) => {
    if (rec !== recognition) return; // Late result from a replaced or stopped recognizer
    // Accumulate ALL results (not just from resultIndex)
    // so we always have the full transcript for consumed-syllable tracking
    let fullText = '';
    // "Final" = the latest segment is finished (not: any segment so far — that made every update look final)
    const hasFinal = event.results.length > 0 && event.results[event.results.length - 1].isFinal;
    for (let i = 0; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      fullText += t;
    }

    // Silence is not being stuck. With the mic level, vadTick() handles this; without it,
    // shift the match clocks forward by any pause between results.
    const now = Date.now();
    if (!vadActive() && lastResultAt && now - lastResultAt > 1500) {
      const gap = now - lastResultAt;
      lastMatchTime = Math.min(now, lastMatchTime + gap);
      lastRealMatchTime = Math.min(now, lastRealMatchTime + gap);
    }
    lastResultAt = now;

    const transcript = fullText.trim();
    if (transcript.length > 0 && settings.diagnosticMode) {
      transcriptLog.push({ t: now - (sessionStats.startTime || now), lang: rec.lang, text: transcript, final: hasFinal });
    }
    if (transcript.length > 0) {
      // Track for stale recognition watchdog (Chrome goes silent after FINAL)
      if (transcript !== lastTranscriptContent) {
        lastTranscriptContent = transcript;
        lastTranscriptTime = Date.now();
        speechMsSinceTranscript = 0;
      }
      processTranscription(transcript, hasFinal);
    }
  };

  let hadFatalError = false;

  // Errors that restarting won't fix — stop voice and tell the user instead of retrying every 200ms
  // ('no-speech' and 'aborted' are normal and handled by the auto-restart in onend)
  const FATAL_SPEECH_ERRORS = {
    'network': 'Speech API network error',
    'not-allowed': 'Mic permission denied — check browser settings',
    'service-not-allowed': 'Speech recognition blocked — on Mac, turn on Dictation (System Settings → Keyboard)',
    'audio-capture': 'Microphone disconnected — check the mic, then start again',
    'language-not-supported': `Speech language ${lang} not supported by this browser`,
  };

  rec.onerror = (event) => {
    if (rec !== recognition) return;
    addDiagLine(`Speech error: ${event.error}`, 'nomatch');
    if (event.error === 'network') {
      addDiagLine('Web Speech API could not connect to Google servers.', 'nomatch');
      addDiagLine('Possible fixes:', 'nomatch');
      addDiagLine('  1. Check your internet connection', 'nomatch');
      addDiagLine('  2. Try opening chrome://settings/content/siteDetails?site=http://localhost:8080 and allow microphone', 'nomatch');
      addDiagLine('  3. Try using Safari instead (uses on-device Apple speech recognition)', 'nomatch');
    }
    const fatalMsg = FATAL_SPEECH_ERRORS[event.error];
    // Permission errors can be a one-off glitch mid-take: retry once, give up if it repeats within a minute
    if (fatalMsg && (event.error === 'not-allowed' || event.error === 'service-not-allowed')
        && Date.now() - lastPermissionErrorAt > 60000) {
      lastPermissionErrorAt = Date.now();
      addDiagLine(`Permission error (${event.error}) — retrying once`, 'warn');
      return; // onend auto-restarts
    }
    if (fatalMsg) {
      hadFatalError = true;
      addDiagLine(fatalMsg, 'nomatch');
      stopSession();
      isVoiceActive = false;
      const vmBtn = document.getElementById('voice-mode-btn');
      if (vmBtn) { vmBtn.textContent = 'Voice: OFF'; vmBtn.classList.remove('on'); }
      broadcastTpState();
      // Set after stopSession, which shows 'Session ended'
      const text = document.getElementById('status-text');
      if (text) text.textContent = fatalMsg;
    }
  };

  rec.onend = () => {
    // Replaced (language switch, watchdog) or stopped — the current recognizer handles itself
    if (rec !== recognition) return;
    // Auto-restart after browser timeouts — NOT after fatal errors
    if (isVoiceActive && isStarted && !isPaused && !hadFatalError) {
      sessionStats.recognitionRestarts++;
      addDiagLine(`Recognition restarted (${currentRecogLang})`, '');
      lastConsumedSylCount = 0; // Reset — new recognition session starts fresh
      setTimeout(() => {
        if (rec !== recognition || !isVoiceActive || !isStarted || isPaused) return;
        try { rec.start(); } catch (err) { addDiagLine('Recognition restart failed: ' + err.message, 'nomatch'); }
      }, 200);
    }
  };

  try {
    rec.start();
    startStaleWatchdog();
    addDiagLine(`Speech recognition started (${lang})`, 'match');
  } catch (err) {
    addDiagLine('Failed to start recognition: ' + err.message, 'nomatch');
  }
}

function stopSpeechRecognition() {
  stopStaleWatchdog();
  if (recognition) {
    try { recognition.stop(); } catch {}
    recognition = null;
  }
}

// Chrome stale recognition watchdog: Chrome's Web Speech API sometimes goes silent
// (no new transcription content) while technically still running. This watchdog
// detects that and force-restarts recognition.
function startStaleWatchdog() {
  stopStaleWatchdog();
  lastTranscriptTime = Date.now();
  lastTranscriptContent = '';
  speechMsSinceTranscript = 0;
  staleWatchdogTimer = setInterval(() => {
    if (!isVoiceActive || !isStarted || isPaused || !recognition) return;
    const silentMs = Date.now() - lastTranscriptTime;
    // Restart when no new text for 7s (refreshes Chrome's recognizer during long pauses), or sooner
    // when the mic hears you talking for ~3s and nothing is transcribed (recognizer stalled)
    const talkingNoText = vadActive() && speechMsSinceTranscript > 3000;
    if (silentMs > 7000 || talkingNoText) {
      const why = talkingNoText ? `talking ${(speechMsSinceTranscript / 1000).toFixed(1)}s with no text` : `${(silentMs / 1000).toFixed(0)}s silent`;
      sessionStats.watchdogRestarts++;
      speechMsSinceTranscript = 0;
      addDiagLine(`Stale recognition detected (${why}) — restarting`, 'warn');
      addStateLine(`Watchdog: restarting recognition (${why})`);
      lastTranscriptContent = '';
      lastTranscriptTime = Date.now();
      lastConsumedSylCount = 0;
      lastMatchTime = Date.now(); // Reset so early language switch doesn't fire on stale data
      // Fresh recognizer (same path as a language switch): also recovers one that died without firing onend
      initSpeechRecognition(currentRecogLang);
    }
  }, 1000);
}

function stopStaleWatchdog() {
  if (staleWatchdogTimer) {
    clearInterval(staleWatchdogTimer);
    staleWatchdogTimer = null;
  }
}

// ---- Language switching ----
function getRecogLangCode(lang) {
  const found = AVAILABLE_LANGS.find(l => l.code === lang);
  return found ? found.recog : 'en-US';
}

function checkLanguageSwitch(currentWord) {
  if (currentWord >= scriptWords.length - 1) return;

  // Look at the next few words to determine upcoming language
  const lookAhead = 3;
  let nextLang = null;
  for (let i = currentWord + 1; i < Math.min(currentWord + lookAhead + 1, scriptWords.length); i++) {
    // Find the first word that has matchable characters (skip empty/punctuation)
    if (scriptWords[i].sylEnd > scriptWords[i].sylStart) {
      nextLang = scriptWords[i].lang;
      break;
    }
  }
  if (!nextLang) return;

  const neededLang = getRecogLangCode(nextLang);
  if (neededLang !== currentRecogLang) {
    sessionStats.langSwitches++;
    addDiagLine(`Language switch: ${currentRecogLang} → ${neededLang}`, 'info');
    lastConsumedSylCount = 0; // Reset consumed — new recognition session
    lastLanguageSwitchTime = Date.now();
    initSpeechRecognition(neededLang);
  }
}

let diagInterimCount = 0;
function processTranscription(transcript, isFinal) {
  // Only log every 5th interim to reduce noise
  diagInterimCount++;
  if (isFinal || diagInterimCount % 5 === 0) {
    const shortTranscript = transcript.length > 60 ? '...' + transcript.slice(-60) : transcript;
    addDiagLine(`${isFinal ? 'FINAL' : 'interim'}: "${shortTranscript}"`, '');
  }

  const timeSinceMatch = Date.now() - lastMatchTime;
  // The "stuck" relaxations use time since the last REAL match (unstick/early switch don't reset it)
  const match = findBestMatch(transcript, scriptSyllables, currentAlignPos, Date.now() - lastRealMatchTime);
  if (match) {
    sessionStats.matchCount++;
    sessionStats.uniqueWordsMatched.add(match.wordIndex);
    sessionStats.totalConfidence += match.confidence;
    sessionStats.highestWordReached = Math.max(sessionStats.highestWordReached, match.wordIndex + 1);
    const isNewWord = match.wordIndex !== currentWordIndex;
    const prevLineIndex = currentLineIndex;
    const isNewLine = match.lineIndex !== prevLineIndex;
    // A real match behind a guessed position: the guesses were wrong — drop their caption entries
    const pulledBack = match.wordIndex < currentWordIndex;
    if (pulledBack && provisionalFrom >= 0) {
      captionTimeline.length = provisionalFrom;
      addDiagLine(`Pulled back to word ${match.wordIndex} (guessed position was ${currentWordIndex})`, 'info');
    }
    currentAlignPos = match.pos;
    currentWordIndex = match.wordIndex;
    currentLineIndex = match.lineIndex;
    lastMatchTime = Date.now();
    markRealPosition();
    diagLastMatchLine = match.lineIndex;

    if (isNewWord) {
      const wordText = scriptWords[match.wordIndex]?.text ?? '?';
      addDiagLine(`>>> WORD ${match.wordIndex}: "${wordText}" line ${match.lineIndex} (conf: ${(match.confidence * 100).toFixed(0)}%, try${match.tryNum})`, 'match');
    }

    // Send word highlight to teleprompter (only when it moved — results arrive several times a second)
    if (isNewWord || match.lineIndex !== prevLineIndex) {
      broadcastMessage({ type: 'highlightWord', wordIndex: match.wordIndex, lineIndex: match.lineIndex });
    }
    updateRemainingTime(match.lineIndex);
    if (isNewLine || pulledBack) { recordLineTransition(match.lineIndex); updateActiveChapter(); highlightCurrentLineInList(); }

    // End of script — matched last word
    if (match.wordIndex >= scriptWords.length - 1) {
      addDiagLine(`=== END OF SCRIPT === (${formatTime(elapsedSeconds)})`, 'info');
      const text = document.getElementById('status-text');
      if (text) text.textContent = `Done! (${formatTime(elapsedSeconds)})`;
    }

    // Check if upcoming words need a different recognition language
    checkLanguageSwitch(match.wordIndex);
  } else {
    const currentLine = currentAlignPos < scriptSyllables.length
      ? scriptSyllables[currentAlignPos]?.lineIndex ?? currentLineIndex : currentLineIndex;
    const allHeardSyls = heardUnits(transcript);
    const newSylCount = allHeardSyls.length - lastConsumedSylCount;
    const stuckSec = (timeSinceMatch / 1000).toFixed(0);

    // Show what we're searching for vs where we're looking
    const newKo = allHeardSyls.slice(lastConsumedSylCount);
    const heardFirst = newKo.slice(0, 10).join('');
    const heardLast = newKo.slice(-10).join('');
    const scriptSnippet = scriptSyllables.slice(currentAlignPos, currentAlignPos + 15).map(s => s.char).join('');
    if (newSylCount >= 2) {
      addDiagLine(`No match (word ${currentWordIndex}, line ${currentLine}, ${stuckSec}s stuck, ${newSylCount} new syls)`, 'nomatch');
      addDiagLine(`  heard: "${heardFirst}…${heardLast}" | script: "${scriptSnippet}"`, 'nomatch');
    }

    // Early language switch: if stuck 1.5s+ and a language change is coming within next few words, switch now
    // This prevents the recognizer from producing garbage when you've moved past a language boundary
    // Skip if a language switch happened recently (3s cooldown) to avoid fighting with checkLanguageSwitch
    const timeSinceSwitch = Date.now() - lastLanguageSwitchTime;
    if (timeSinceMatch > 1500 && newSylCount > 5 && timeSinceSwitch > 3000) {
      const lookEnd = Math.min(currentWordIndex + 5, scriptWords.length);
      for (let w = currentWordIndex + 1; w < lookEnd; w++) {
        if (scriptWords[w].sylEnd > scriptWords[w].sylStart) {
          const neededLang = getRecogLangCode(scriptWords[w].lang);
          if (neededLang !== currentRecogLang) {
            // Advance past remaining same-language words to the language boundary
            currentWordIndex = w;
            currentAlignPos = scriptWords[w].sylStart;
            currentLineIndex = scriptWords[w].lineIndex;
            recordProvisionalLine(scriptWords[w].lineIndex);
            sessionStats.langSwitches++;
            sessionStats.stuckEvents++;
            addDiagLine(`Early lang switch (stuck ${stuckSec}s): ${currentRecogLang} → ${neededLang} at word ${w}`, 'info');
            broadcastMessage({ type: 'highlightWord', wordIndex: w, lineIndex: scriptWords[w].lineIndex });
            lastConsumedSylCount = 0;
            lastMatchTime = Date.now();
            lastLanguageSwitchTime = Date.now();
            initSpeechRecognition(neededLang);
            return; // Exit processTranscription — new recognition session will handle the rest
          }
        }
      }
    }

    // Unstick: after 3s of speech without a match, creep forward 3 words (silence doesn't count).
    // Bigger recoveries come from the wider search window once stuck > 8s.
    if (timeSinceMatch > 3000 && newSylCount > 10) {
      const advanceBy = 3;
      const nextWord = Math.min(currentWordIndex + advanceBy, scriptWords.length - 1);
      if (nextWord > currentWordIndex) {
        currentWordIndex = nextWord;
        currentAlignPos = scriptWords[nextWord].sylStart;
        currentLineIndex = scriptWords[nextWord].lineIndex;
        recordProvisionalLine(scriptWords[nextWord].lineIndex);
        lastMatchTime = Date.now(); // Reset so we don't cascade unstick every frame
        sessionStats.unstickCount++;
        sessionStats.stuckEvents++;
        addDiagLine(`Unstick: advanced to word ${nextWord} ("${scriptWords[nextWord].text}")`, 'warn');
        broadcastMessage({ type: 'highlightWord', wordIndex: nextWord, lineIndex: scriptWords[nextWord].lineIndex });
        checkLanguageSwitch(nextWord);
      }
    }
  }
}

function updateRemainingTime(currentLine) {
  const totalLines = chapters.reduce((sum, ch) => sum + ch.lines.length, 0);
  const remainingLines = totalLines - currentLine;
  if (totalLines > 0 && elapsedSeconds > 5 && currentLine > 0) {
    const pace = elapsedSeconds / currentLine;
    const remaining = remainingLines * pace;
    const el = document.getElementById('remaining-time');
    if (el) el.textContent = formatTime(remaining);
  }
}

// ---- Diagnostic ----
let diagMatchCount = 0;
let diagNoMatchCount = 0;
let diagLastMatchLine = -1;

// Session stats for browser comparison
let sessionStats = {};
function resetSessionStats() {
  sessionStats = {
    matchCount: 0,
    uniqueWordsMatched: new Set(),
    totalConfidence: 0,
    stuckEvents: 0,       // times stuck > 3s
    unstickCount: 0,
    watchdogRestarts: 0,
    recognitionRestarts: 0,
    langSwitches: 0,
    highestWordReached: 0,
    startWordIndex: currentWordIndex || 0,
    startTime: Date.now(),
  };
}
resetSessionStats();

function logSessionSummary() {
  const duration = (Date.now() - sessionStats.startTime) / 1000;
  const uniqueMatched = sessionStats.uniqueWordsMatched.size;
  const coverage = scriptWords.length > 0
    ? ((sessionStats.highestWordReached / scriptWords.length) * 100).toFixed(0) : 0;
  const matchRate = sessionStats.highestWordReached > 0
    ? ((uniqueMatched / sessionStats.highestWordReached) * 100).toFixed(0) : 0;
  const avgConf = sessionStats.matchCount > 0
    ? ((sessionStats.totalConfidence / sessionStats.matchCount) * 100).toFixed(0) : 0;
  const wpm = duration > 5 ? ((sessionStats.highestWordReached / duration) * 60).toFixed(0) : '-';
  const browser = navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome') ? 'Safari' : 'Chrome';

  const summary = [
    `\n=== SESSION SUMMARY (${browser}) ===`,
    `Duration: ${formatTime(Math.round(duration))}`,
    `Words reached: ${sessionStats.highestWordReached} / ${scriptWords.length} (${coverage}% coverage)`,
    `Match rate: ${matchRate}% (${uniqueMatched} unique words matched)`,
    `Avg confidence: ${avgConf}%`,
    `Tracking speed: ${wpm} words/min`,
    `Stuck events (>3s): ${sessionStats.stuckEvents}`,
    `Unstick advances: ${sessionStats.unstickCount}`,
    `Watchdog restarts: ${sessionStats.watchdogRestarts}`,
    `Recognition restarts: ${sessionStats.recognitionRestarts}`,
    `Language switches: ${sessionStats.langSwitches}`,
    `================================`,
  ];
  summary.forEach(line => addStateLine(line));
  // Save rehearsal stats
  if (duration > 10 && matchRate > 0) {
    saveRehearsalSession(+matchRate, +(wpm === '-' ? 0 : wpm), +coverage);
  }
}

function addStateLine(text) {
  // Always log state changes (start/stop/voice toggle) even if diagnostic mode is off
  const log = document.getElementById('diag-log');
  if (!log) return;
  const line = document.createElement('div');
  line.className = 'diag-line info';
  line.textContent = `[${new Date().toLocaleTimeString()}] STATE: ${text}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 2000) log.removeChild(log.firstChild);
}

function addDiagLine(text, cls) {
  if (!settings.diagnosticMode) return;
  const log = document.getElementById('diag-log');
  if (!log) return;
  const line = document.createElement('div');
  line.className = 'diag-line' + (cls ? ' ' + cls : '');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  while (log.children.length > 2000) log.removeChild(log.firstChild);

  // Update stats
  if (cls === 'match') { diagMatchCount++; diagNoMatchCount = 0; }
  if (cls === 'nomatch') diagNoMatchCount++;
  updateDiagStats();
}

function updateDiagStats() {
  const el = document.getElementById('diag-stats');
  if (!el) return;
  const currentLine = currentAlignPos < scriptSyllables.length
    ? scriptSyllables[currentAlignPos]?.lineIndex ?? currentLineIndex : currentLineIndex;
  const totalLines = chapters.reduce((sum, ch) => sum + ch.lines.length, 0);
  const stuckWarn = diagNoMatchCount > 10 ? ' | STUCK?' : '';
  const srtInfo = captionTimeline.length > 0 ? ` | SRT: ${captionTimeline.length}` : '';
  el.textContent = `Word ${currentWordIndex}/${scriptWords.length} | Line ${currentLine}/${totalLines} | Matches: ${diagMatchCount} | Misses: ${diagNoMatchCount}${stuckWarn}${srtInfo}`;
}

function copyDiagLog() {
  const log = document.getElementById('diag-log');
  if (!log) return;

  // Build header with context
  const currentLine = currentAlignPos < scriptSyllables.length
    ? scriptSyllables[currentAlignPos]?.lineIndex ?? currentLineIndex : currentLineIndex;
  const totalLines = chapters.reduce((sum, ch) => sum + ch.lines.length, 0);

  let header = `=== SyncPrompt Debug Log (${APP_VERSION}) ===\n`;
  header += `Time: ${new Date().toLocaleString()}\n`;
  header += `Browser: ${navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome') ? 'Safari' : 'Chrome'}\n`;
  header += `Script lines: ${totalLines} | Script syllables: ${scriptSyllables.length} | Script words: ${scriptWords.length}\n`;
  header += `Current position: word ${currentWordIndex}, line ${currentLine}, syllable ${currentAlignPos}\n`;
  header += `Consumed: ${lastConsumedSylCount}\n`;
  header += `Total matches: ${diagMatchCount}\n`;
  // Session stats summary
  const ss = sessionStats;
  const dur = (Date.now() - ss.startTime) / 1000;
  const uniqueM = ss.uniqueWordsMatched.size;
  const cov = scriptWords.length > 0 ? ((ss.highestWordReached / scriptWords.length) * 100).toFixed(0) : 0;
  const mRate = ss.highestWordReached > 0 ? ((uniqueM / ss.highestWordReached) * 100).toFixed(0) : 0;
  const avgC = ss.matchCount > 0 ? ((ss.totalConfidence / ss.matchCount) * 100).toFixed(0) : 0;
  const wpmRate = dur > 5 ? ((ss.highestWordReached / dur) * 60).toFixed(0) : '-';
  header += `Session: coverage ${cov}% | match ${mRate}% (${uniqueM}/${ss.highestWordReached} words) | conf ${avgC}% | ${wpmRate} wpm | stuck ${ss.stuckEvents}x | unstick ${ss.unstickCount}x | watchdog ${ss.watchdogRestarts}x | restarts ${ss.recognitionRestarts}x | lang ${ss.langSwitches}x\n`;
  header += `Settings: fontSize=${settings.fontSize}, voice=${settings.voiceEngine}, recogLang=${currentRecogLang}\n`;
  header += `Line languages: ${scriptLineLangs.map((l, i) => `[${i}]${l}`).join(' ')}\n`;

  // Words per line — helps spot problematic long lines
  const wordsPerLine = {};
  scriptWords.forEach(w => { wordsPerLine[w.lineIndex] = (wordsPerLine[w.lineIndex] || 0) + 1; });
  header += `Words/line: ${Object.entries(wordsPerLine).map(([i, c]) => `[${i}]${c}`).join(' ')}\n`;

  // Show word context around current position
  const wordCtxStart = Math.max(0, currentWordIndex - 3);
  const wordCtxEnd = Math.min(scriptWords.length, currentWordIndex + 8);
  const wordCtx = [];
  for (let i = wordCtxStart; i < wordCtxEnd; i++) {
    wordCtx.push(i === currentWordIndex ? `[${scriptWords[i].text}]` : scriptWords[i].text);
  }
  header += `Words around pos: …${wordCtx.join(' ')}…\n`;

  // Get the script text around current position for context
  const scriptLines = [];
  let lineIdx = 0;
  chapters.forEach(ch => {
    ch.lines.forEach(l => {
      if (Math.abs(lineIdx - currentLine) <= 3) {
        scriptLines.push(`  ${lineIdx === +currentLine ? '>>>' : '   '} [${lineIdx}] ${l.text}`);
      }
      lineIdx++;
    });
  });
  header += `\nScript context (around line ${currentLine}):\n${scriptLines.join('\n')}\n`;
  // SRT caption timeline
  if (captionTimeline.length > 0) {
    header += `\n=== SRT Timeline (${captionTimeline.length} entries) ===\n`;
    const allLines = chapters.flatMap(ch => ch.lines);
    captionTimeline.forEach((entry, i) => {
      const lineText = allLines[entry.lineIndex]?.text || '?';
      const preview = lineText.replace(/\*\*/g, '').substring(0, 50);
      const srtNum = getSrtLineNumber(entry.lineIndex);
      header += `  SRT#${srtNum || '-'} line[${entry.lineIndex}] ${formatSrtTime(entry.ms)} "${preview}"\n`;
    });
  }

  header += `\n=== Log entries ===\n`;

  // Get log lines
  const lines = Array.from(log.querySelectorAll('.diag-line'))
    .map(el => el.textContent)
    .join('\n');

  navigator.clipboard.writeText(header + lines).then(() => {
    addDiagLine('Log copied to clipboard!', 'info');
  }).catch(() => {
    // Fallback: select text
    const range = document.createRange();
    range.selectNodeContents(log);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    addDiagLine('Select All done — press Cmd+C to copy', 'info');
  });
}

function clearDiagLog() {
  const log = document.getElementById('diag-log');
  if (!log) return;
  log.innerHTML = '<div class="diag-line info">Log cleared.</div>';
  diagMatchCount = 0;
  diagNoMatchCount = 0;
  updateDiagStats();
}

// ---- Reset ----
function resetToTop() {
  if (isStarted) stopSession();
  currentLineIndex = 0;
  currentWordIndex = 0;
  currentAlignPos = 0;
  lastConsumedSylCount = 0;
  markRealPosition();
  broadcastMessage({ type: 'highlightWord', wordIndex: 0, lineIndex: 0 });
  elapsedSeconds = 0;
  updateTimerDisplay();
  const rem = document.getElementById('remaining-time');
  if (rem) rem.textContent = '--';
  const text = document.getElementById('status-text');
  if (text) text.textContent = 'Ready';
  updateActiveChapter();
}

// ---- Keyboard ----
function handleKeyboard(e) {
  // A read-only (locked) editor doesn't swallow shortcuts; clicker/pedal keys work even with a slider focused
  const pedalKey = e.key === 'PageDown' || e.key === 'PageUp';
  if ((e.target.tagName === 'TEXTAREA' && !e.target.readOnly)
      || (e.target.tagName === 'INPUT' && !(pedalKey && e.target.type === 'range'))) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return; // Leave Cmd+R, Cmd+F etc. to the browser
  // Holding a key must not count as pressing it again (E/R confirmation, Space pause/resume)
  if (e.repeat && !REPEATABLE_KEYS.includes(e.key)) return;

  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (isTeleprompterOpen()) toggleStart();
      break;
    case 'ArrowUp':
      e.preventDefault();
      broadcastMessage({ type: 'nudge', pixels: -40 });
      break;
    case 'ArrowDown':
      e.preventDefault();
      broadcastMessage({ type: 'nudge', pixels: 40 });
      break;
    case 'ArrowLeft':
      e.preventDefault();
      jumpToChapter(getCurrentChapterIndex() - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      jumpToChapter(getCurrentChapterIndex() + 1);
      break;
    case '+':
    case '=':
      e.preventDefault();
      updateSetting('fontSize', Math.min(80, settings.fontSize + 2));
      document.getElementById('slider-fontSize').value = settings.fontSize;
      break;
    case '-':
    case '_':
      e.preventDefault();
      updateSetting('fontSize', Math.max(16, settings.fontSize - 2));
      document.getElementById('slider-fontSize').value = settings.fontSize;
      break;
    case 'f':
    case 'F':
      e.preventDefault();
      broadcastMessage({ type: 'toggleFullscreen' });
      break;
    case 'm':
    case 'M':
      e.preventDefault();
      toggleSetting('mirrorMode', document.getElementById('btn-mirror'));
      break;
    case 'r':
    case 'R':
      e.preventDefault();
      confirmThenRun('r', resetToTop);
      break;
    case 'b':
    case 'B':
      e.preventDefault();
      // Clicker "blank screen" buttons often send B — don't jump mid-take
      if (isStarted && !isPaused) break;
      jumpToNextBookmark();
      break;
    case 'e':
    case 'E':
      e.preventDefault();
      confirmThenRun('e', endSession);
      break;
    case 'PageDown':
      e.preventDefault();
      stepLine(1);
      break;
    case 'PageUp':
      e.preventDefault();
      stepLine(-1);
      break;
    case 'v':
    case 'V':
      e.preventDefault();
      toggleVoiceMode();
      break;
    case '?':
      e.preventDefault();
      showHelp();
      break;
    case 't':
    case 'T':
      e.preventDefault();
      if (isTeleprompterOpen()) {
        teleprompterWindow.focus();
      } else {
        openTeleprompterWindow();
      }
      break;
    case 'Escape':
      closeHelp();
      cancelCountdown();
      break;
  }
}

function getCurrentChapterIndex() {
  if (chapters.length === 0) return 0;
  let lineCount = 0;
  for (let i = 0; i < chapters.length; i++) {
    lineCount += chapters[i].lines.length;
    if (lineCount > currentLineIndex) return i;
  }
  return chapters.length - 1;
}

function updateActiveChapter() {
  const idx = getCurrentChapterIndex();
  document.querySelectorAll('.chapter-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}


// ============================================================
// TELEPROMPTER WINDOW
// ============================================================
function initTeleprompterWindow() {
  bc = new BroadcastChannel('teleprompter');
  settings = loadSettings();
  // Teleprompter always uses dark theme for status bar styling
  document.body.classList.add('theme-dark');
  scriptText = localStorage.getItem('tp_script') || '';
  chapters = parseChapters(scriptText);
  loadBookmarks();

  document.body.innerHTML = `
    <div class="teleprompter-window" id="tp-window">
      <div class="tp-status-bar" id="tp-status-bar">
        <span class="tp-status-tag"><span class="tp-status-dot off" id="tp-status-session"></span> <span id="tp-status-session-label">Ready</span></span>
        <span class="tp-status-tag"><span class="tp-status-dot off" id="tp-status-voice"></span> <span id="tp-status-voice-label">Voice OFF</span></span>
      </div>
      <div class="v-mask-top" id="v-mask-top"></div>
      <div class="v-mask-bottom" id="v-mask-bottom"></div>
      <div class="focus-line" id="focus-line"></div>
      <div class="teleprompter-scroll-container" id="tp-container">
        <div class="teleprompter-content" id="tp-content"></div>
      </div>
      <div class="countdown-overlay" id="tp-countdown"></div>
      <div class="tp-notice" id="tp-notice"></div>
    </div>
  `;

  renderTeleprompter();
  positionFocusLine();
  applyVMask();
  startRenderLoop();

  bc.onmessage = (e) => {
    const msg = e.data;
    switch (msg.type) {
      case 'settings':
        settings = msg.settings;
        scheduleRerender(false);
        break;
      case 'script':
        scriptText = msg.scriptText;
        settings = msg.settings;
        chapters = parseChapters(scriptText);
        loadBookmarks();
        if (!isScrolling) {
          // Only reset position if not actively scrolling (i.e. not during session)
          scrollY = 0;
          targetScrollY = 0;
          currentLineIndex = 0;
          currentWordIndex = 0;
        }
        renderTeleprompter();
        positionFocusLine();
        applyVMask();
        if (isScrolling || currentLineIndex > 0) {
          scrollToLine(currentLineIndex, false);
        }
        break;
      case 'render':
        scheduleRerender(true);
        break;
      case 'scrollToLine':
        scrollToLine(msg.lineIndex, msg.smooth !== false);
        break;
      case 'startManualScroll':
        manualScrollSpeed = msg.speed;
        isScrolling = true;
        // Leaving voice mode: clear word dimming left from the voice position
        if (currentWordIndex > 0) {
          wordEls.forEach(el => el && el.classList.remove('spoken'));
          currentWordIndex = 0;
        }
        break;
      case 'updateSpeed':
        manualScrollSpeed = msg.speed;
        break;
      case 'stopScroll':
        isScrolling = false;
        break;
      case 'nudge':
        targetScrollY += msg.pixels;
        targetScrollY = Math.max(0, targetScrollY);
        break;
      case 'highlightWord':
        highlightWord(msg.wordIndex, msg.lineIndex);
        break;
      case 'toggleFullscreen':
        toggleFullscreen();
        break;
      case 'countdown':
        showCountdown(msg.text);
        break;
      case 'tpState':
        updateTpStatusBar(msg);
        setWakeLock(!!msg.started);
        break;
      case 'notice': {
        const n = document.getElementById('tp-notice');
        if (n) { n.textContent = msg.text || ''; n.classList.toggle('visible', !!msg.text); }
        break;
      }
    }
  };

  // Click to re-anchor
  document.getElementById('tp-content').addEventListener('click', (e) => {
    const lineEl = e.target.closest('.teleprompter-line');
    if (lineEl) {
      const idx = parseInt(lineEl.dataset.lineIndex);
      if (!isNaN(idx)) {
        bc.postMessage({ type: 'lineClicked', lineIndex: idx });
        scrollToLine(idx, true);
      }
    }
  });

  // The browser drops the wake lock when the window is hidden — take it again when visible
  document.addEventListener('visibilitychange', acquireWakeLock);

  // Keyboard in teleprompter window
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return; // Leave Cmd+R, Cmd+F etc. to the browser
    if (e.repeat && !REPEATABLE_KEYS.includes(e.key)) return; // Held keys don't repeat actions
    switch (e.key) {
      case 'PageDown':
      case 'PageUp':
        e.preventDefault();
        bc.postMessage({ type: 'stepLineFromTP', delta: e.key === 'PageDown' ? 1 : -1 });
        break;
      case ' ':
        e.preventDefault();
        bc.postMessage({ type: 'toggleStartFromTP' });
        break;
      case 'f': case 'F':
        e.preventDefault();
        toggleFullscreen();
        break;
      case 'ArrowUp':
        e.preventDefault();
        targetScrollY -= 40;
        targetScrollY = Math.max(0, targetScrollY);
        break;
      case 'ArrowDown':
        e.preventDefault();
        targetScrollY += 40;
        break;
      case 'ArrowLeft':
        e.preventDefault();
        bc.postMessage({ type: 'prevChapterFromTP' });
        break;
      case 'ArrowRight':
        e.preventDefault();
        bc.postMessage({ type: 'nextChapterFromTP' });
        break;
      case 'v': case 'V':
        e.preventDefault();
        bc.postMessage({ type: 'toggleVoiceFromTP' });
        break;
      case 'm': case 'M':
        e.preventDefault();
        bc.postMessage({ type: 'toggleMirrorFromTP' });
        break;
      case 'e': case 'E':
        e.preventDefault();
        bc.postMessage({ type: 'endSessionFromTP' });
        break;
      case 'r': case 'R':
        e.preventDefault();
        bc.postMessage({ type: 'resetFromTP' });
        break;
      case '+': case '=':
        e.preventDefault();
        bc.postMessage({ type: 'fontSizeFromTP', delta: 2 });
        break;
      case '-': case '_':
        e.preventDefault();
        bc.postMessage({ type: 'fontSizeFromTP', delta: -2 });
        break;
    }
  });

  // Resize (incl. entering/leaving fullscreen): re-render once things settle, keeping the reading position
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => scheduleRerender(false), 100);
  });

  // Ask the control window for the full current state (first open, reopen, or reload mid-take)
  bc.postMessage({ type: 'tpReady' });
}

// ---- Re-render without losing the reading position ----
let wordEls = [];       // by word index — cached after each render
let lineEls = [];       // by line index
let lastFocusOffset = 0;
let rerenderPending = false;
let rerenderBookmarks = false;

// One re-render per frame, however many settings messages arrive (slider drags)
function scheduleRerender(reloadBookmarks) {
  if (reloadBookmarks) rerenderBookmarks = true;
  if (rerenderPending) return;
  rerenderPending = true;
  requestAnimationFrame(() => {
    rerenderPending = false;
    if (rerenderBookmarks) { loadBookmarks(); rerenderBookmarks = false; }
    const anchor = captureAnchor();
    renderTeleprompter();
    positionFocusLine();
    applyVMask();
    restoreAnchor(anchor);
  });
}

// What is at the reading line now: the current word (voice mode), else the current line + how far into it
function captureAnchor() {
  const content = document.getElementById('tp-content');
  if (!content || lineEls.length === 0) return null;
  const wordEl = wordEls[currentWordIndex];
  if (!isScrolling && currentWordIndex > 0 && wordEl
      && +wordEl.closest('.teleprompter-line').dataset.lineIndex === currentLineIndex) {
    return { word: currentWordIndex };
  }
  // Otherwise: whichever line is at the reading line right now, and how far into it
  const focusY = targetScrollY + lastFocusOffset;
  let idx = 0;
  for (let i = 0; i < lineEls.length; i++) {
    if (lineEls[i] && offsetTopIn(lineEls[i], content) <= focusY) idx = i;
    else break;
  }
  const line = lineEls[idx];
  const frac = (focusY - offsetTopIn(line, content)) / (line.offsetHeight || 1);
  return { line: idx, frac: Math.max(0, Math.min(1, frac)) };
}

function restoreAnchor(a) {
  const content = document.getElementById('tp-content');
  if (!content || !a) return;
  const focusOffset = (window.innerHeight * settings.focusLinePercent) / 100;
  let y = null;
  if (a.word != null && wordEls[a.word]) {
    y = offsetTopIn(wordEls[a.word], content) - focusOffset;
  } else if (a.line != null && lineEls[a.line]) {
    const el = lineEls[a.line];
    y = offsetTopIn(el, content) + a.frac * el.offsetHeight - focusOffset;
  }
  if (y === null) return;
  scrollY = targetScrollY = Math.max(0, y);
  content.style.transform = `translateY(${-scrollY}px)`;
}

function setLineState(el, i, current) {
  if (!el) return;
  el.classList.remove('past', 'current', 'future');
  el.classList.add(i < current ? 'past' : i === current ? 'current' : 'future');
}

function renderTeleprompter() {
  const content = document.getElementById('tp-content');
  const tpWindow = document.getElementById('tp-window');
  if (!content || !tpWindow) return;

  const focusOffset = (window.innerHeight * settings.focusLinePercent) / 100;
  const bottomPad = window.innerHeight * 0.7;

  // Mirror
  tpWindow.classList.toggle('mirrored', settings.mirrorMode);

  let html = `<div style="height: ${focusOffset}px;"></div>`;

  let globalLineIdx = 0;
  let globalWordIdx = 0;
  chapters.forEach((chap, chIdx) => {
    if (chIdx > 0) {
      html += `<div class="teleprompter-chapter-divider${settings.showChapterDividers ? '' : ' hidden'}"></div>`;
    }
    chap.lines.forEach(line => {
      const state = globalLineIdx < currentLineIndex ? 'past' :
                    globalLineIdx === currentLineIndex ? 'current' : 'future';
      // Split into words and wrap each in a span
      const cleanText = line.text.replace(/\*\*/g, '').replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, '');
      const words = cleanText.split(/\s+/).filter(w => w.length > 0);
      // Also check for bold markers in original text
      const boldWords = new Set();
      const boldRegex = /\*\*(.+?)\*\*/g;
      let bm;
      while ((bm = boldRegex.exec(line.text)) !== null) {
        bm[1].split(/\s+/).forEach(w => boldWords.add(w));
      }
      const wordSpans = words.map(w => {
        const spoken = globalWordIdx < currentWordIndex ? 'spoken' : '';
        const escaped = escapeHtml(w);
        const display = boldWords.has(w) ? `<strong>${escaped}</strong>` : escaped;
        const span = `<span class="tp-word ${spoken}" data-word-index="${globalWordIdx}">${display}</span>`;
        globalWordIdx++;
        return span;
      }).join(' ');
      const noteClass = isNoteLine(line.text) ? ' note-line' : '';
      const bmClass = bookmarkedLines.has(globalLineIdx) ? ' bookmarked' : '';
      html += `<div class="teleprompter-line ${state}${noteClass}${bmClass}" data-line-index="${globalLineIdx}">${wordSpans}</div>`;
      globalLineIdx++;
    });
  });

  html += `<div class="teleprompter-end-marker">- END -</div>`;
  html += `<div style="height: ${bottomPad}px;"></div>`;

  content.innerHTML = html;

  // Apply styles
  content.style.cssText = `
    font-size: ${settings.fontSize}px;
    font-family: "${settings.fontFamily}", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-weight: ${settings.fontBold ? 'bold' : 'normal'};
    line-height: ${settings.lineHeight};
    padding: 0 ${settings.marginH}px;
    --dim-opacity: ${settings.dimOpacity};
    color: #fff;
  `;
  // cssText reset the transform — put it back so nothing flashes
  content.style.transform = `translateY(${-scrollY}px)`;

  lastFocusOffset = focusOffset;
  wordEls = [];
  lineEls = [];
  content.querySelectorAll('.tp-word').forEach(el => { wordEls[+el.dataset.wordIndex] = el; });
  content.querySelectorAll('.teleprompter-line').forEach(el => { lineEls[+el.dataset.lineIndex] = el; });
}

function applyVMask() {
  const top = document.getElementById('v-mask-top');
  const bottom = document.getElementById('v-mask-bottom');
  if (top) top.style.height = settings.marginV + 'px';
  if (bottom) bottom.style.height = settings.marginV + 'px';
}

function positionFocusLine() {
  const fl = document.getElementById('focus-line');
  if (fl) {
    fl.style.top = (window.innerHeight * settings.focusLinePercent / 100) + 'px';
    // Arrows point at the middle of the current text line, centred in the side margins.
    // They must fit in the margin — with no room, only the line is shown.
    const markerSize = Math.round(Math.min(settings.fontSize * 0.6, settings.marginH - 4));
    let marker = settings.readingMarker || 'both';
    if (markerSize < 10 && marker !== 'off') marker = 'line';
    fl.className = 'focus-line marker-' + marker;
    fl.style.setProperty('--marker-size', markerSize + 'px');
    fl.style.setProperty('--marker-mid', Math.round(settings.fontSize * settings.lineHeight / 2) + 'px');
    fl.style.setProperty('--marker-inset', Math.max(2, Math.round((settings.marginH - markerSize) / 2)) + 'px');
  }
}

function scrollToLine(lineIndex, smooth) {
  currentLineIndex = lineIndex;
  const content = document.getElementById('tp-content');
  if (!content) return;

  if (lineIndex >= 0 && lineIndex < lineEls.length) {
    const el = lineEls[lineIndex];
    const focusOffset = (window.innerHeight * settings.focusLinePercent) / 100;
    const newY = Math.max(0, offsetTopIn(el, content) - focusOffset);
    targetScrollY = newY;
    if (!smooth) {
      // Instant snap for jumps (chapter click, line click, reset)
      scrollY = newY;
      content.style.transform = `translateY(${-scrollY}px)`;
    }
  }

  // Update line states
  lineEls.forEach((el, i) => setLineState(el, i, lineIndex));
}

// offsetTop relative to `container`, even when an ancestor line is positioned
// (bookmarked lines are position: relative, which makes them their words' offsetParent)
function offsetTopIn(el, container) {
  let y = 0;
  while (el && el !== container) {
    y += el.offsetTop;
    el = el.offsetParent;
  }
  return y;
}

function highlightWord(wordIndex, lineIndex) {
  const content = document.getElementById('tp-content');
  if (!content) return;
  const prevWord = currentWordIndex;
  const prevLine = currentLineIndex;
  currentLineIndex = lineIndex;
  currentWordIndex = wordIndex;

  // Only the words and lines between the old and new position change state
  for (let i = Math.min(prevWord, wordIndex); i <= Math.max(prevWord, wordIndex); i++) {
    if (wordEls[i]) wordEls[i].classList.toggle('spoken', i < wordIndex);
  }
  const lineLo = Math.max(0, Math.min(prevLine, lineIndex));
  const lineHi = Math.min(lineEls.length - 1, Math.max(prevLine, lineIndex));
  for (let i = lineLo; i <= lineHi; i++) setLineState(lineEls[i], i, lineIndex);

  // Glide to the current word (not the line top — handles long wrapped lines); the render loop eases there.
  // Long jumps (reset, chapter, reload) snap instead of streaming the whole script past.
  const scrollTarget = wordEls[wordIndex] || lineEls[lineIndex];
  if (scrollTarget) {
    const focusOffset = (window.innerHeight * settings.focusLinePercent) / 100;
    targetScrollY = Math.max(0, offsetTopIn(scrollTarget, content) - focusOffset);
    if (Math.abs(targetScrollY - scrollY) > window.innerHeight * 0.8) {
      scrollY = targetScrollY;
      content.style.transform = `translateY(${-scrollY}px)`;
    }
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// ---- Screen wake lock (teleprompter window) ----
// Nobody touches the Mac during a voice take, so without this the display (and the Elgato) can sleep
let wakeLock = null;
let wakeLockWanted = false;
let wakeLockPending = false;

function setWakeLock(on) {
  wakeLockWanted = on;
  if (on) {
    acquireWakeLock();
  } else if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

function acquireWakeLock() {
  if (!wakeLockWanted || wakeLock || wakeLockPending) return;
  if (!navigator.wakeLock || document.visibilityState !== 'visible') return;
  wakeLockPending = true;
  navigator.wakeLock.request('screen').then(lock => {
    wakeLockPending = false;
    if (!wakeLockWanted) { lock.release().catch(() => {}); return; }
    wakeLock = lock;
    lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
  }).catch(err => {
    wakeLockPending = false;
    console.warn('Screen wake lock unavailable:', err.message);
  });
}

function updateTpStatusBar(state) {
  const bar = document.getElementById('tp-status-bar');
  const sessionLabel = document.getElementById('tp-status-session-label');
  const sessionDot = document.getElementById('tp-status-session');
  const voiceLabel = document.getElementById('tp-status-voice-label');
  const voiceDot = document.getElementById('tp-status-voice');
  if (!bar) return;

  if (sessionDot) sessionDot.className = 'tp-status-dot ' + (state.started ? 'on' : 'off');
  if (sessionLabel) sessionLabel.textContent = state.started
    ? (state.scrolling ? 'Scrolling' : state.voice ? 'Listening' : 'Started')
    : 'Ready';

  if (voiceDot) voiceDot.className = 'tp-status-dot ' + (state.voice ? (state.started ? 'listening' : 'on') : 'off');
  if (voiceLabel) voiceLabel.textContent = state.voice ? 'Voice ON' : 'Voice OFF';

  bar.classList.toggle('running', state.started);
}

function showCountdown(text) {
  const overlay = document.getElementById('tp-countdown');
  if (!overlay) return;
  if (text === null) {
    overlay.classList.remove('visible');
  } else {
    overlay.textContent = text;
    overlay.classList.add('visible');
  }
}

// ---- Render loop ----
// Speeds are per second (dt-based), so scrolling looks the same at 60 Hz and 120 Hz
let lastFrameAt = 0;
let lastLineTrackAt = 0;
let appliedScrollY = null;

function startRenderLoop() {
  const content = document.getElementById('tp-content');
  function frame(now) {
    const dt = lastFrameAt ? Math.min(0.1, (now - lastFrameAt) / 1000) : 1 / 60;
    lastFrameAt = now;

    // Manual scroll: same speed as before at 60 fps (speed/50 px per 60 Hz frame)
    if (isScrolling) targetScrollY += (manualScrollSpeed / 50) * 60 * dt;
    const maxScroll = content.scrollHeight - window.innerHeight;
    if (targetScrollY > maxScroll && maxScroll > 0) {
      targetScrollY = maxScroll; // also stops nudges past the end
      if (isScrolling) {
        isScrolling = false; // End of script reached
        bc.postMessage({ type: 'endOfScript' });
      }
    }
    targetScrollY = Math.max(0, targetScrollY);

    // Ease towards the target (12% per 60 Hz frame)
    const diff = targetScrollY - scrollY;
    if (Math.abs(diff) > 0.5) {
      scrollY += diff * (1 - Math.pow(0.88, dt * 60));
    } else {
      scrollY = targetScrollY;
    }

    if (scrollY !== appliedScrollY) {
      content.style.transform = `translateY(${-scrollY}px)`;
      appliedScrollY = scrollY;
    }

    // Track current line during manual scroll (~6 times per second)
    if (isScrolling && now - lastLineTrackAt > 160) {
      lastLineTrackAt = now;
      const focusY = scrollY + (window.innerHeight * (settings.focusLinePercent / 100));
      let closestIdx = 0;
      for (let i = 0; i < lineEls.length; i++) {
        if (lineEls[i] && offsetTopIn(lineEls[i], content) <= focusY) closestIdx = i;
        else break;
      }
      if (closestIdx !== currentLineIndex) {
        currentLineIndex = closestIdx;
        bc.postMessage({ type: 'focusLineChanged', lineIndex: closestIdx });
        lineEls.forEach((el, i) => setLineState(el, i, closestIdx));
      }
    }

    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}

let rafId = null;
window.addEventListener('beforeunload', () => { if (rafId) cancelAnimationFrame(rafId); });

// ---- Init ----
if (IS_TELEPROMPTER) {
  initTeleprompterWindow();
} else {
  initControlWindow();
}
</script>
